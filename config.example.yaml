api_keys:
  github: ""
  chaos: ""
  securitytrails: ""
  shodan: ""
  binaryedge: ""
  censys: ""
  certspotter: ""
  passivetotal: ""

tools:
  bbot:
    enabled: true
    config_file: ""  # Será gerado automaticamente
    extra_args:
      - "--allow-deadly"
      - "--modules" 
      - "subdomain-enum,portscan,web-basic,vulnscan,cloudcheck,excavate,speculate,unarchive,apk,docker"
      - "--output-module" 
      - "json"
      - "--quiet"
      - "--auto-start"
  httpx:
    tech_detect: true
    enabled: true
  nmap: /usr/bin/nmap
  sqlmap:
    enabled: true
    proxy: ""
    level: 3
    risk: 2
    extra_args: ["--batch"]
  enum4linux_ng:
    enabled: true
    threads: 10
  ffuf:
    enabled: true
    rate_limit: 0
    proxy: ""
    extra_args: ["-ac"]
  nikto:
    enabled: true
    pause_seconds: 0
    proxy: ""
    extra_args: ["-Format", "json"] # Assegura que a flag e o valor estão separados
  dirsearch:
    enabled: true
    threads: 0
    proxy: ""
    extra_args: ["-r"]
  feroxbuster:
    enabled: true
    threads: 0
    proxy: ""
    extra_args: ["-q"]
  gobuster:
    enabled: true
    threads: 0
    proxy: ""
    extra_args: ["-q"]
  dalfox:
    enabled: true
    proxy: ""
    extra_args: ["--silence"]
  paramspider:
    enabled: true
    proxy: ""
    extra_args: []
  subzy:
    enabled: true
    extra_args: ["--hide_fails"]
  arjun:
    enabled: true
    extra_args: []
  trufflehog:
    enabled: true
    path: ""  # Vazio = herda de resultsPath/web/assets
    entropy: true
    rules: ""  # Custom rules
    no_verify: false  # Verifica secrets reais
    proxy: ""  # Herda de WAF
    rate_limit: 0  # Herda de WAF
    concurrency: 0  # Herda de engine
    json_output: true
    extra_args:
      - "--only-verified"  # Foca em secrets confirmados
      - "--exclude-paths .git"  # Ignora dirs sensíveis
engine:
  proxy:
    enabled: true
    address: "socks5://127.0.0.1:9050"
  max_parallel_tasks: 8
  temp_dir: "/mnt/dexter_storage/redrecon_tmp"
  discord:
    enabled: true
    token: 
    prefix: "!"
    webhook_url: ""
    default_channel_id: ""
    security:                 
      enabled: false
      whitelist_users:               
      - ""    
      allowed_roles:                  
      - ""
      deny_message: "Você não tem permissão chefia."  
      log_unauthorized: true
  waf:
    enabled: true
    default_profile: "stealth" # Perfil padrão a ser usado
    profiles: # Mapa de perfis de WAF
      stealth: # Nome do perfil, corresponde a default_profile
        rate_limit: 5
        concurrency: 3
        proxy_file: ""
        proxies: # Lista de proxies para este perfil
          - "socks5://127.0.0.1:9050"
          - "http://proxy1.corp:3128"
      aggressive: # Outro perfil disponível
        rate_limit: 5
        concurrency: 3
        proxy_file: "/opt/proxies/aggressive.txt"

recon:
  web:
    enabled: true
    depth: 4
    concurrency: 0
    proxy: ""
    extra_args: []  # ex.: ["-ignore-ext .pdf"]
  subzy:
    enabled: true
  naabu:
    enabled: true
  subfinder:
    enabled: true
    all: true
    threads: 50
    proxy: ""
    extra_args: ["-timeout 30", "-max-time 600"]
  amass:
    enabled: true
    passive: true
    timeout: 15
    extra_args: ["-noalts", "-nolocals"]
  sublist3r:
    enabled: true
    threads: 10
    extra_args: ["-v"]
  assetfinder:
    enabled: true
    extra_args: []
  chaos:
    enabled: true
    api_key: ""
    extra_args: []
  enum4linux-ng:
    enabled: true
  certspotter:
    enabled: true
    extra_args: []
  shuffledns:
    enabled: true
    wordlist: "/t"
    extra_args: []
  crt:
    enabled: true
    extra_args: []
  crt_db:
    enabled: true
    extra_args: []
  httpx:
    enabled: true
    threads: 50
    proxy: ""
    extra_args: ["-status-code"]
  katana:
    enabled: true
    depth: 5
    proxy: ""
    extra_args: ["-silent"]
  gau:
    enabled: true
    extra_args: ["--subs"]
  kiterunner:
    enabled: true
    extra_args: ["-A=apiroutes-211028:2.3.1"]
  wafw00f:
    enabled: true
    proxy: ""
    extra_args: []
  cve_search:
    enabled: true
    extra_args: []    
  nuclei:
    enabled: true
    groups:
      cve:          ["cve"]
      misconfig:    ["misconfig"]      # misconfigurations
      exposure:     ["exposure"]       # exposed panels, files, etc.
      wordpress:    ["wordpress"]      # WP-specific
      joomla:       ["joomla"]
      drupal:       ["drupal"]
      apache:       ["apache"]
      iis:          ["iis"]
      nginx:        ["nginx"]
      php:          ["php"]
      java:         ["java"]
      nodejs:       ["nodejs"]
      cloud:        ["cloud"]          # AWS, Azure, GCP
      api:          ["api"]            # generic API checks
      graphql:      ["graphql"]
      ssti:         ["ssti"]
      xss:          ["xss"]
      sqli:         ["sql-injection"]
      lfi:          ["lfi"]
      rce:          ["rce"]
      default:      ["cve","exposure","misconfig"]
    templates:
      - technologies
      - vulnerabilities
      - cves
      - default-logins
      - cloud
    owasp_templates:
      - "http/vulnerabilities/access-control/"
      - "http/vulnerabilities/command-injection/"
      - "http/vulnerabilities/xss/"
    monitor_templates: []  # Para scans contínuos (ex.: ["monitoring/"])
    proxy: ""              # Vazio = herda de WAF
    rate_limit: 0          # 0 = usa perfil WAF
    concurrency: 8         # 0 = usa engine.max_parallel_tasks
    aggressive: false      # Ativa templates de risco alto
    headless: true         # Modo batch
    json_output: true      # Facilita parsing
    extra_args:
      - "-severity high,critical"  # Foca em severidades altas
      - "-stats"                   # Estatísticas no output
  enum4linux_ng:
    enabled: true
    threads: 10
  bbot:
    enabled: true
    # === PRESETS (usando -p) ===
    presets:
      - subdomain-enum
      - web-basic
      - spider
      - email-enum

    # === FLAGS (usando -f) ===
    flags:
      - passive           # opcional: só fontes passivas
      - safe              # evita módulos agressivos
      - aggressive      # descomente se quiser

