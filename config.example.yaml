monitor:
  enabled: true
  frequency: "6h"                   # Ciclos principais
  update_freq: "24h"                # Auto-update templates
  notify_on_new: true               # Alertas Discord
  auto_escalate: true               # Prosseguir para pentest se critical
  ai_threshold: 0.7                 # Score AI para escalar (ex.: pkg/ai.AnalyzeOutput)
  bbot_rotation:                    # Rotação inicial (dinâmica sobrepõe)
    - "recon/scans/maximum"
    - "recon/scans/light"
  nuclei_lfr_group: "bugbounty-lfr" # Grupo focado
  baseline_file: "monitor_baseline.json" # Para diffs

nuclei:
  templates_groups: # Corrigido: movido para dentro de nuclei
    bugbounty-lfr: # Corrigido: lista de templates adicionada aqui
      - "http/vulnerabilities/"
      - "http/misconfiguration/exposed-panels.yaml"
      - "http/takeovers/"
      - "http/exposures/"

orchestration:
  attackmate:
    enabled: true
    path: ""
    playbooks:
      - playbooks/recon-to-exploit.yaml
      - playbooks/vuln-to-c2.yaml
    rate_limit: 0
    proxy: ""
  sliver:
    enabled: true
    path: "/usr/local/bin/sliver"
    server_addr: "127.0.0.1:31337"
    operator: ""
    lhost: ""
metasploit:
  enabled: true
  host: 127.0.0.1:55552 #"http://127.0.0.1:55553/api/"
  pass: "msfpass"
  timeout: 30s
  retry: 3
  auto_escalate: true
  modules:                              # ← 30 MÓDULOS PRONTOS PARA COPIAR-COLAR
    # === WINDOWS (SMB, RDP, IIS) ===
    windows:
      - "exploit/windows/smb/ms17_010_eternalblue"      # EternalBlue (CRITICAL)
      - "exploit/windows/rdp/cve_2019_0708_bluekeep"    # BlueKeep RDP
      - "exploit/windows/iis/iis_webdav_scstoragepathfromurl"

    # === WORDPRESS (RCE + plugins) ===
    wordpress:
      - "exploit/unix/webapp/wp_admin_shell_upload"     # RCE via upload
      - "exploit/multi/http/wp_reflex_gallery_upload"  # Reflex Gallery
      - "exploit/multi/http/wp_wpscan_enum"             # Enum + brute (aux)

    # === APACHE / TOMCAT ===
    apache:
      - "exploit/multi/http/apache_mod_cgi_bash_env_exec" # ShellShock
      - "exploit/multi/http/tomcat_mgr_upload"           # Manager upload
      - "exploit/multi/http/tomcat_jsp_upload_bypass"    # Bypass auth
      - "exploit/multi/http/tomcat_partial_put_deserialization" # CVE-2025-24813

    # === IIS ===
    iis:
      - "exploit/windows/iis/ms15_034_httpreq"           # DoS → RCE
      - "exploit/windows/iis/iis_webdav_scstoragepathfromurl"

    # === JAVA / STRUTS / JENKINS ===
    java:
      - "exploit/multi/http/struts2_rest_xstream"        # Struts2 RCE
      - "exploit/multi/http/jenkins_script_console"     # Jenkins Groovy
      - "exploit/multi/http/apache_struts2_content_type_ognl"

    # === GITLAB / GIT ===
    gitlab:
      - "exploit/multi/http/gitlab_user_enum"
      - "exploit/multi/http/gitlab_wiki_rce"

    # === JOOMLA / DRUPAL ===
    joomla:
      - "exploit/multi/http/joomla_http_header_rce"
    drupal:
      - "exploit/unix/webapp/drupal_drupalgeddon2"       # Drupalgeddon-2

    # === PHP (PHP-CGI, Laravel) ===
    php:
      - "exploit/multi/http/php_cgi_arg_injection"
      - "exploit/multi/http/laravel_token_unserialize_rce"

    # === NODEJS / EXPRESS ===
    nodejs:
      - "auxiliary/scanner/http/node_js_debugger"

    # === CLOUD / K8S ===
    cloud:
      - "auxiliary/scanner/http/kubernetes_api_server"
      - "exploit/multi/http/kubelet_rbac_rce"

    # === DEFAULT (recon + low-hanging) ===
    default:
      - "auxiliary/scanner/http/http_version"           # Banner grab
      - "auxiliary/scanner/http/dir_listing"            # Open dirs
      - "auxiliary/scanner/http/robots_txt"             # Robots
      - "auxiliary/scanner/ssl/openssl_heartbleed"      # Heartbleed