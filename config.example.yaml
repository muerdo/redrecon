  vuln_check:
    description: "Vulnerability checking (nuclei, wpscan, etc.)"
    bbot:
      modules: ${modules_groups.vuln_check}
      flags: [active, aggressive, web-thorough]
      output_modules: [json, web_report]
  cloud:
    description: "Cloud enumeration (buckets, tenants, etc.)"
    bbot:
      modules: ${modules_groups.cloud}
      flags: [passive, cloud-enum, safe]
      output_modules: [json]
  bypass:
    description: "Bypass techniques (403, smuggling, etc.)"
    bbot:
      modules: ${modules_groups.bypass}
      flags: [active, aggressive, web-thorough]
      output_modules: [json]
  downloadfiles:
    description: "File downloads (apk, files, etc.)"
    bbot:
      modules: ${modules_groups.downloadfiles}
      flags: [passive, safe]
      output_modules: [json]
  git:
    description: "Git-related (repos, gitlab)"
    bbot:
      modules: ${modules_groups.git}
      flags: [code-enum, safe]
      output_modules: [json]
  graphql:
    description: "GraphQL introspection"
    bbot:
      modules: ${modules_groups.graphql}
      flags: [active, safe, web-basic]
      output_modules: [json]
  hunt:
    description: "Parameter hunting"
