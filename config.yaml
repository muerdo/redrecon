targets:
  # Esta seção é um placeholder para guiar a implementação no script principal.
  # O script que utiliza este YAML deve ser capaz de ler alvos de múltiplas fontes.
  # Exemplo de uso no script principal:
  #
  # 1. Arquivo de alvos:
  #    python main.py --targets-file /path/to/targets.txt
  #
  # 2. Alvo único ou múltiplos na linha de comando:
  #    python main.py -t evilcorp.com 1.2.3.4 1.2.3.0/24 https://evilcorp.com ORG:evilcorp FILESYSTEM:/tmp/evil
  #
  # O script deverá passar esses alvos para as ferramentas configuradas, como o bbot.
  # Ex: bbot -t evilcorp.com -t 1.2.3.4 --preset recon_light ...
  file: "" # Caminho para um arquivo .txt contendo uma lista de alvos (um por linha)
  list: [] # Lista de alvos passados diretamente via linha de comando

api_keys:
  github: ""
  chaos: ""
  securitytrails: ""
  shodan: ""
  binaryedge: ""
  censys: ""
  certspotter: ""
  passivetotal: ""

tools:
  bbot:
    enabled: false
    config_file: ""  # Será gerado automaticamente
    modules:
      - "subdomain-enum"
      - "portscan"
      - "web-basic"
      - "vulnscan"
      - "cloudcheck"
      - "excavate"
      - "speculate"
      - "unarchive"
      - "apk"
      - "docker"
    output_modules: ["json"]
    extra_args: ["--allow-deadly", "--quiet", "--auto-start"]
  crackmapexec:
    enabled: true
    protocol: "smb"
    extra_args: ["--gen-relay-list relay_targets.txt"]
  bloodhound:
    enabled: false
    collection_method: "All" # Métodos: Default, All, DCOnly, LoggedOn, Trusts, ACL, ObjectProps, etc.
    extra_args: ["-ns"] # Ex: --nameserver
  certipy:
    enabled: false
    extra_args: ["-vulnerable"]
  impacket:
    enabled: true
    extra_args: []
  httpx:
    tech_detect: true
    enabled: true
  nmap: /usr/bin/nmap
  rustscan:
    enabled: true
    path: "/usr/bin/rustscan"
    extra_args: ["-b", "1500", "--timeout", "2000"]
  sqlmap:
    enabled: true
    proxy: "http://127.0.0.1:8080"
    level: 3
    risk: 2
    extra_args: ["-A -Pn --top-ports 100000 --min-rate 1000 -T3 -sS -sV"]
  
  nikto:
    enabled: false
    pause_seconds: 0
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-nolookup json"]
  enum4linux:
    enabled: true
    threads: 10
  ffuf:
    enabled: true
    rate_limit: 0
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-ac"]
  dirsearch:
    enabled: true
    threads: 0
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-r"]
  feroxbuster:
    enabled: true
    threads: 50
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-q"]
  gobuster:
    enabled: true
    threads: 50
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-q"]
  dalfox:
    enabled: true
    proxy: "http://127.0.0.1:8080"
    extra_args: ["--silence"]
  paramspider:
    enabled: true
    proxy: "http://127.0.0.1:8080"
    extra_args: []
  subzy:
    enabled: true
    extra_args: ["--hide_fails"]
  arjun:
    enabled: true
    extra_args: []
  trufflehog:
    enabled: true
    path: "/usr/local/bin/trufflehog"
    entropy: true
    rules: ""  # Custom rules
    no_verify: false  # Verifica secrets reais
    proxy: "http://127.0.0.1:8080"
    rate_limit: 0  # Herda de WAF
    concurrency: 0  # Herda de engine
    json_output: true
    extra_args:
      - "--only-verified"  # Foca em secrets confirmados
      - "--exclude-paths .git"  # Ignora dirs sensíveis
  nuclei:
    enabled: true
    templates:
      - technologies
      - vulnerabilities
      - cves
      - default-logins
      - cloud
    owasp_templates:
      - "http/vulnerabilities/access-control/"
      - "http/vulnerabilities/command-injection/"
      - "http/vulnerabilities/xss/"
    monitor_templates: []  # Para scans contínuos (ex.: ["monitoring/"])
    concurrency: 8
    rate_limit: 50
    headless: true
    update_templates: true
    silent: true
    timeout: 900 # 15 minutos em segundos
engine:
  proxy: "http://127.0.0.1:8080"
  enabled: true
  address: "http://127.0.0.1:8080"
  max_parallel_tasks: 8
  resource_limits:
    enabled: true
    cpu_threshold: 60.0
    ram_threshold: 60.0
    check_interval: "5s"
  temp_dir: "/tmp/redrecon_tmp"
  discord:
    enabled: false
    token: ""
    prefix: "!"
    webhook_url: ""
    default_channel_id: ""
    security:                 
      enabled: false
      whitelist_users:               
      - "000000000000000000"    
      allowed_roles:                  
      - "000000000000000000"
      deny_message: "Access Denied."  
      log_unauthorized: true
  waf:
    enabled: true
    default_profile: "stealth" # Perfil padrão a ser usado
    profiles: # Mapa de perfis de WAF
      stealth: # Nome do perfil, corresponde a default_profile
        rate_limit: 5
        concurrency: 3
        proxy_file: ""
        proxies: # Lista de proxies para este perfil
          - "http://127.0.0.1:8080"
          - "http://proxy1.corp:3128"
      aggressive: # Outro perfil disponível
        rate_limit: 5
        concurrency: 3
        proxy_file: "/opt/proxies/aggressive.txt"

recon:
  bbot:
    profile: "web-thorough"           # Preset oficial: httpx + wappalyzer + robots + dirsearch + paramminer
    modules: []                       # Usa todo o preset
    flags:
      - subdomain-enum
      - web-screenshots
      - port-scan
    config:
      web:
        spider_distance: 2
        spider_depth: 3
      output:
        modules:
          - ndjson
          - txt
      modules:
        gowitness:
          resolution_x: 1920
          resolution_y: 1080
  nikto:
    enabled: true                     # Liga/desliga a ferramenta
    output_format: "json"             # Força JSON para parsing
    output_file: "nikto_findings.json" # Nome do arquivo de saída
    proxy: "http://127.0.0.1:8080"
    tuning: "1234567890"              # Todos os testes de tuning
    maxtime: 300                      # Tempo máximo por host (segundos)
    evasion: "1"                      # Técnica de evasão (ex: "1" para LibWhisker)
    pause_seconds: 2                  # Pausa entre os testes (segundos)
    follow_redirects: true            # Segue redirecionamentos 3xx
    mutate: "1,2,3"                   # Tipos de mutação de teste
    timeout: 30                       # Timeout por requisição (segundos)
  web:
    enabled: true
    depth: 4
    concurrency: 0
    proxy: "http://127.0.0.1:8080"
    extra_args: []  # ex.: ["-ignore-ext .pdf"]
  subzy:
    enabled: true
  naabu:
    enabled: true
  subfinder:
    enabled: true
    all: true
    threads: 50
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-timeout 30", "-max-time 600"]
  amass:
    enabled: true
    passive: true
    timeout: 15
    extra_args: ["-noalts", "-nolocals"]
  sublist3r:
    enabled: true
    threads: 50
    extra_args: ["-v"]
  assetfinder:
    enabled: true
    extra_args: []
  chaos:
    enabled: true
    api_key: ""
    extra_args: []
  certspotter:
    enabled: true
    extra_args: []
  shuffledns:
    enabled: true
    wordlist: "/usr/share/seclists/Discovery/DNS/subdomains-top1million-110000.txt"
    extra_args: []
  crt:
    enabled: true
    extra_args: []
  crt_db:
    enabled: true
    extra_args: []
  httpx:
    enabled: true
    threads: 50
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-status-code"]
  katana:
    enabled: true
    depth: 5
    proxy: "http://127.0.0.1:8080"
    extra_args: ["-silent"]
  gau:
    enabled: true
    extra_args: ["--subs"]
  kiterunner:
    enabled: true
    extra_args: ["-A=apiroutes-211028:2.3.1"]
  wafw00f:
    enabled: true
    proxy: "http://127.0.0.1:8080"
    extra_args: []
  cve_search:
    enabled: true
    extra_args: []    
  uncover:
    enabled: true
    limit: 100
    engines: ["shodan", "censys", "fofa"]
    extra_args: []


  enum4linux:
    enabled: true
    threads: 10
  amass-args: "-passive -noalts -nolocals"
  subfinder-args: "-all -silent"

wordlists:
  subdomains: "/usr/share/seclists/Discovery/DNS/subdomains-top1million-110000.txt"
  fuzzing: "/usr/share/seclists/Discovery/Web-Content/directory-list-2.3-medium.txt"

# ... outras configurações ...

